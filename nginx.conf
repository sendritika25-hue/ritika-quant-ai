worker_processes auto;
pid /home/sendritika25/nginx_app/nginx.pid;
error_log /home/sendritika25/nginx_app/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /home/sendritika25/nginx_app/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /home/sendritika25/nginx_app/access.log;

    client_body_temp_path /home/sendritika25/nginx_app/client_body_temp;
    proxy_temp_path /home/sendritika25/nginx_app/proxy_temp;
    fastcgi_temp_path /home/sendritika25/nginx_app/fastcgi_temp;
    uwsgi_temp_path /home/sendritika25/nginx_app/uwsgi_temp;
    scgi_temp_path /home/sendritika25/nginx_app/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server {
        listen 8501;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:8502;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        location /_stcore/stream {
            proxy_pass http://127.0.0.1:8502/_stcore/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
    }
}

